# ===========================================
# NATS Server Configuration
# ===========================================

# Server identification
server_name: "cms-nats"

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring endpoint
http_port: 8222

# ===========================================
# JetStream Configuration
# ===========================================
jetstream {
  # Storage directory for persistence
  store_dir: /data/jetstream
  
  # Memory storage limit (for in-memory streams)
  max_mem_store: 256MB
  
  # File storage limit (for persistent streams)
  max_file_store: 1GB
}

# ===========================================
# Logging
# ===========================================
debug: false
trace: false
logtime: true

# ===========================================
# Cluster Configuration (for future scaling)
# ===========================================
# cluster {
#   name: "cms-cluster"
#   listen: 0.0.0.0:6222
  
#   # Add routes here when scaling to multiple nodes:
#   # routes: [
#   #   nats-route://nats-1:6222
#   #   nats-route://nats-2:6222
#   # ]
# }

# ===========================================
# Authorization (uncomment for production)
# ===========================================
# authorization {
#   # Simple token auth
#   token: "your-secret-token-here"
#   
#   # Or user/password
#   # users: [
#   #   { user: "webshop", password: "secret1" }
#   #   { user: "smtp", password: "secret2" }
#   #   { user: "admin", password: "admin-secret" }
#   # ]
# }

# ===========================================
# Limits
# ===========================================
max_connections: 1000
max_payload: 1MB
max_pending: 64MB

# Ping/Pong settings for connection health
ping_interval: "2m"
ping_max: 2