global:
  scrape_interval: 15s
  evaluation_interval: 1m

rule_files:
- rules.yml

scrape_configs:
# - job_name: grafana
#   static_configs:
#   - targets: [ grafana:3000 ]

- job_name: prometheus
  static_configs:
  - targets: [ localhost:9090 ]

- job_name: node
  static_configs:
  - targets: [ exporter:9100 ]

- job_name: nats
  static_configs:
  - targets: [ nats_prom:7777 ]

- job_name: services
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/*.yml
    refresh_interval: 30s
